<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded px-3">
        <a class="navbar-brand" th:href="@{/employees/list}">EMS</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/employees/list}">Employees</a>
            <a class="nav-link active" th:href="@{/employees/add}">Add Employee</a>
            <a class="nav-link" th:href="@{/employees/search}">Search</a>
            <a class="nav-link" th:href="@{/employees/statistics}">Statistics</a>
        </div>
    </nav>

    <div class="card col-md-8 mx-auto shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add New Employee</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/employees/add}" th:object="${employee}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="name">Employee Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="department">Department</label>
                    <select class="form-select" id="department" th:field="*{department}">
                        <option value="">Select Department</option>
                        <option th:each="dept : ${departments}" th:value="${dept.name}" th:text="${dept.name}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}">
                </div>

                <div class="d-flex justify-content-between">
                    <a class="btn btn-secondary" th:href="@{/employees/list}">Back to List</a>
                    <button type="submit" class="btn btn-success">Save Employee</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
