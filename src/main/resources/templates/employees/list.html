<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded px-3">
        <a class="navbar-brand" th:href="@{/employees/list}">EMS</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/employees/list}">Employees</a>
            <a class="nav-link" th:href="@{/employees/add}">Add Employee</a>
            <a class="nav-link" th:href="@{/employees/search}">Search</a>
            <a class="nav-link" th:href="@{/employees/statistics}">Statistics</a>
        </div>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Employee List</h2>
        <div>
            <a class="btn btn-primary" th:href="@{/employees/add}">Add New Employee</a>
            <a class="btn btn-outline-secondary" th:href="@{/employees/search}">Search</a>
            <a class="btn btn-outline-info" th:href="@{/employees/statistics}">Statistics</a>
        </div>
    </div>

    <table class="table table-bordered table-hover table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Code</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.code}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.department}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" class="text-center text-muted">No employees found</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
