<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded px-3">
        <a class="navbar-brand" th:href="@{/employees/list}">EMS</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/employees/list}">Employees</a>
            <a class="nav-link" th:href="@{/employees/add}">Add Employee</a>
            <a class="nav-link active" th:href="@{/employees/search}">Search</a>
        </div>
    </nav>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Search Employees</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/employees/search}" method="get" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" th:value="${name}" placeholder="Search by name">
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="department">Department</label>
                    <select class="form-select" id="department" name="department">
                        <option value="">All Departments</option>
                        <option th:each="dept : ${departments}" th:value="${dept.name}" th:text="${dept.name}" th:selected="${dept.name == department}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                </div>
            </form>
        </div>
    </div>

    <h4>Search Results</h4>
    <table class="table table-bordered table-hover table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Code</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.code}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.department}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" class="text-center text-muted">No employees match the search criteria</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
